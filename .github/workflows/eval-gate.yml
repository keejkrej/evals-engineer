name: eval-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest

      - name: Restore eval cache
        uses: actions/cache@v4
        with:
          path: .eval-cache
          key: eval-${{ runner.os }}-${{ hashFiles('fixtures/gate_current.json', 'fixtures/gate_baseline.json') }}

      - name: Regression gate
        id: gate
        run: |
          python -m evals_engineer.cli gate \
            --current fixtures/gate_current.json \
            --baseline fixtures/gate_baseline.json \
            --state reports/gate-state.json \
            --comment pr-comment.md

      - name: Post gate comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr-comment.md')) return;
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
